<div class="hoose-password-wrap" *ngIf="control">
  <div class="hoose-form-field">
    <label class="hoose-form-label">
      {{ label }} <span *ngIf="required" class="text-danger">*</span>
    </label>
    <div class="hoose-password-input-wrap">
      <input
        [type]="mostrar ? 'text' : 'password'"
        class="hoose-password-input"
        [placeholder]="placeholder"
        [value]="value"
        (input)="onInput($event.target.value)"
        (blur)="onBlur()"
        autocomplete="new-password"
      />
      <button type="button" class="hoose-password-toggle" (click)="mostrar = !mostrar" tabindex="-1">
        <i class="pi" [ngClass]="mostrar ? 'pi-eye-slash' : 'pi-eye'"></i>
      </button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:2px"><button type="button" class="hoose-regen-btn" (click)="generarContrasenia()" tabindex="-1"><i class="pi pi-refresh"></i> Regenerar</button></div>
    <div class="hoose-strength-bar" *ngIf="value">
      <div class="hoose-strength-track">
        <div class="hoose-strength-fill"
          [style.width.%]="fortaleza.nivel * 25"
          [style.background]="fortaleza.color">
        </div>
      </div>
      <span class="hoose-strength-label" [style.color]="fortaleza.color">{{ fortaleza.texto }}</span>
    </div>
    <div class="hoose-password-reqs" *ngIf="touched && value">
      <span *ngFor="let e of errores" class="hoose-req-item"><i class="pi pi-times-circle"></i> {{ e }}</span>
      <span *ngIf="errores.length === 0" class="hoose-req-ok"><i class="pi pi-check-circle"></i> Contraseña válida</span>
    </div>
  </div>
  <div class="hoose-form-field" *ngIf="confirmar">
    <label class="hoose-form-label">Confirmar <span *ngIf="required" class="text-danger">*</span></label>
    <div class="hoose-password-input-wrap">
      <input
        [type]="mostrarConfirm ? 'text' : 'password'"
        class="hoose-password-input"
        [class.hoose-password-error]="touched && confirmValue && !coinciden"
        [class.hoose-password-ok]="touched && confirmValue && coinciden && errores.length === 0"
        placeholder="Repite la contraseña"
        [value]="confirmValue"
        (input)="confirmValue = $event.target.value; onBlur()"
        (blur)="onBlur()"
        autocomplete="new-password"
      />
      <button type="button" class="hoose-password-toggle" (click)="mostrarConfirm = !mostrarConfirm" tabindex="-1">
        <i class="pi" [ngClass]="mostrarConfirm ? 'pi-eye-slash' : 'pi-eye'"></i>
      </button>
    </div>
    <small *ngIf="touched && confirmValue && !coinciden" style="color:#ef4444">Las contraseñas no coinciden</small>
    <small *ngIf="touched && confirmValue && coinciden && errores.length === 0" style="color:#1BC99A">✓ Coinciden</small>
  </div>
</div>
